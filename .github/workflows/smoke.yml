# Read-only watchdog for the LIVE deployment. CI proves the code; this proves
# the site is actually up. Runs every 6 hours until the tournament ends (safe
# to delete this file after 2026-07-19). It only performs unauthenticated GETs
# — it can never touch league data (do NOT wire scripts/verify-prod.mjs in
# here: that script mutates the live league and is launch-day-only).
#
# Fully automatic: the production address is built in (it is public anyway —
# it's the site the whole league visits). The BASE_URL repository variable,
# if ever set, overrides it (e.g. after a domain change). A failing scheduled
# run emails the repo owner — the alerting channel a solo owner actually
# reads.
name: Live site smoke check

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: ${{ vars.BASE_URL != '' && vars.BASE_URL || 'https://fabians-red-card-production.up.railway.app' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Login page serves
        run: curl -fsS -o /dev/null --max-time 30 --retry 3 "$BASE_URL/login"
      - name: Calendar feed serves all 104 matches
        run: |
          COUNT=$(curl -fsS --max-time 30 --retry 3 "$BASE_URL/api/calendar" | grep -c 'BEGIN:VEVENT')
          echo "calendar events: $COUNT"
          test "$COUNT" -eq 104
